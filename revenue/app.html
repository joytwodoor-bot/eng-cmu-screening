<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: memo-ledger — a paper column on a cool desk; header band carries the faculty line like a บันทึกข้อความ head, tabs underneath, tables in their own scroll boxes */
:root{
  --bg:#eef0f4; --paper:#ffffff; --panel:#f6f7fa; --ink:#1a1c23; --soft:#5b6070; --muted:#868b99;
  --line:#dde0e8; --hair:#eceef3;
  --accent:#8a1c2b; --accent-ink:#ffffff; --accent-soft:#f7e8ea; --bar:#9b2a3a; --bar-hi:#5f0f1b;
  --good:#1d7349; --good-bg:#e4f3eb; --warn:#9a5b00; --warn-bg:#fbf0dc; --bad:#b0261c; --bad-bg:#fbe6e4;
  --f-display:'Bai Jamjuree','Sarabun',system-ui,sans-serif;
  --f-body:'Sarabun','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-num:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121318; --paper:#1b1d24; --panel:#22252d; --ink:#eceef3; --soft:#a6aab7; --muted:#7e8391;
  --line:#343844; --hair:#2a2d36;
  --accent:#e58593; --accent-ink:#1b0a0d; --accent-soft:#3b2228; --bar:#d9707f; --bar-hi:#f3a9b3;
  --good:#6cc995; --good-bg:#1d3328; --warn:#e8ae55; --warn-bg:#3a2e1a; --bad:#f08379; --bad-bg:#3d201e;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121318; --paper:#1b1d24; --panel:#22252d; --ink:#eceef3; --soft:#a6aab7; --muted:#7e8391;
  --line:#343844; --hair:#2a2d36;
  --accent:#e58593; --accent-ink:#1b0a0d; --accent-soft:#3b2228; --bar:#d9707f; --bar-hi:#f3a9b3;
  --good:#6cc995; --good-bg:#1d3328; --warn:#e8ae55; --warn-bg:#3a2e1a; --bad:#f08379; --bad-bg:#3d201e;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.num,td.num,input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--accent)}
.head .eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--soft)}
.mode{font-size:.8rem;color:var(--soft);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.cloud i{background:var(--good)} .mode.local i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;color:var(--soft);font-weight:500}
nav.tabs button:hover{color:var(--ink);background:var(--panel)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* sheets */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet > header{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline}
.sub{color:var(--soft);font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:.8rem;color:var(--soft)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical;border:1px dashed var(--line);border-radius:8px;padding:10px;background:var(--panel);font-family:var(--f-num);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--panel);color:var(--soft);border-color:var(--line)}

/* tables */
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-weight:600;text-align:left;color:var(--soft);font-size:.78rem;background:var(--panel);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
th.num,td.num{text-align:right;white-space:nowrap}
tr.total td{font-weight:600;border-top:1px solid var(--line);background:var(--panel)}
.grid-in input,.grid-in select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--paper);width:100%;min-width:0}
.grid-in input.num{text-align:right;width:7.2em}
.grid-in input.cnt{width:4.2em}
.grid-in td.prog{min-width:270px}
.grid-in select[data-f="dept"]{width:6.5em}
.grid-in td.prog input{margin-bottom:4px;font-size:.85rem}
.grid-in td.prog select{font-size:.85rem}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.x{border:none;background:none;color:var(--muted);font-size:1.1rem;line-height:1}
.x:hover{color:var(--bad)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper)}
.kpi .k{font-size:.8rem;color:var(--soft)}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:.8rem;color:var(--muted)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--hair)} .chart .base{stroke:var(--line)}
.chart text{fill:var(--soft);font-family:var(--f-num);font-size:11px}
.chart text.val{fill:var(--ink);font-weight:600}
.chart .bar{fill:var(--bar)} .chart .bar:hover,.chart .bar.on{fill:var(--bar-hi)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.hbar .lab{color:var(--ink);overflow-wrap:anywhere}
.hbar .track{height:12px;background:var(--hair);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hbar .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--soft)}
.hbar .amt b{color:var(--ink);font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.8rem;padding:5px 9px;border-radius:6px;z-index:50;max-width:260px;font-family:var(--f-num)}

/* empty / notes */
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{background:var(--panel);border-radius:8px;padding:12px 14px;font-size:.88rem;color:var(--soft)}
.note b{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;font-size:.88rem}
.steps div{border-left:3px solid var(--accent);padding:2px 10px;color:var(--soft)}
.steps b{color:var(--ink);display:block}
details summary{cursor:pointer;color:var(--soft);font-weight:500}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--panel)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display)}
.srctext{white-space:pre-wrap;font-size:.86rem;line-height:1.75;background:var(--panel);border-radius:8px;padding:12px 14px;margin-top:8px;max-height:340px;overflow:auto;overflow-wrap:anywhere}
.amt{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:0 5px}
.amt:hover{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}

/* unit report */
.report{display:flex;flex-direction:column;gap:16px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:flex-end;border-bottom:2px solid var(--accent);padding-bottom:10px}
.rep-head .unit{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.rep-head .meta{color:var(--soft);font-size:.88rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.report td:first-child{min-width:15em}
.stmt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stmt > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stmt .k{font-size:.8rem;color:var(--soft)} .stmt .op{font-weight:700;color:var(--accent);margin-right:2px}
.stmt b{font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stmt .s{font-size:.76rem;color:var(--muted)} .stmt .close{background:var(--accent-soft);border-color:transparent}
.invest{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.inv-row{display:flex;flex-direction:column;gap:6px} .inv-k{font-size:.92rem}
.inv-scale{position:relative;display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);min-height:1.2em}
.inv-scale .mark{position:absolute;left:40%;transform:translateX(-50%);white-space:nowrap;color:var(--ink);font-weight:600}
.lbar{position:relative;height:8px;min-width:90px;background:var(--hair);border-radius:4px;margin:4px 0}
.lbar.big{height:16px;border-radius:6px}
.lbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:inherit}
.lbar .fill.over{background:var(--bad)}
.lbar .cap{position:absolute;left:40%;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
@media (max-width:640px){.inv-scale span:not(.mark){display:none}}
.invest .inv-next{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.invest .inv-next .k{font-size:.85rem;color:var(--soft)} .invest .inv-next b{font-family:var(--f-display);font-size:1.3rem}
.invest .inv-next .s{font-size:.76rem;color:var(--muted);flex-basis:100%}
.stmt.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stmt .k .chip{font-size:.68rem;padding:0 7px;margin-left:4px}
.inv-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
@media (max-width:1000px){ .stmt.five{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){ .stmt.five{grid-template-columns:1fr 1fr} .stmt.five .close{grid-column:1/-1} }
/* wide screens: overview and fund pages fit one screen */
@media (min-width:1000px){
  body{padding-block:12px 40px} .wrap{gap:10px}
  .head{padding-bottom:8px} .head h1{font-size:1.3rem} .head .eyebrow{font-size:.72rem}
  nav.tabs button{padding:4px 12px;font-size:.92rem}
  .sheet.dash{padding:14px 18px;gap:10px}
  .dash .stmt > div{padding:8px 12px} .dash .stmt b{font-size:1.2rem} .dash .stmt .s{font-size:.72rem}
  .dash .chart svg{max-height:160px}
  .dash table.tight{font-size:.85rem;line-height:1.3} .dash table.tight td{padding:3px 10px} .dash table.tight th{padding:5px 10px}
  .dash > header .sub{font-size:.78rem} .dash h3{font-size:.95rem}
  .dash .invest .inv-next{padding:6px 12px} .dash .invest .inv-next .s{flex-basis:auto}
}
@media (min-width:1000px) and (max-height:780px){
  body{padding-block:8px 30px} .head .eyebrow{display:none} .head{padding-bottom:6px} nav.tabs button{padding:3px 12px}
  .dash .stmt .s{display:none} .sheet.dash{padding:10px 16px;gap:8px} .dash .card{padding:10px 12px}
}
.dash{gap:12px} .dash .invest{border-top:0;padding-top:0;margin-top:0;gap:6px}
.dash2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.dash .chart svg{max-height:210px}
table.tight td{padding:4px 10px;vertical-align:middle} table.tight th{padding:6px 10px}
td.uname{max-width:19em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcell{display:flex;align-items:center;gap:8px;min-width:150px} .lcell .lbar{flex:1;margin:0}
details.more > summary{cursor:pointer}
details.more:not([open]){gap:0}
.netline{font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chart .bar.pos{fill:var(--good)} .chart .bar.neg{fill:var(--bad)}
tr.dim td{color:var(--muted)}
.grid-in input.open-in{width:10em}
@media (max-width:640px){ .stmt{grid-template-columns:1fr 1fr} }
body.present nav.tabs, body.present .no-present{display:none!important}
.present-exit{display:none}
body.present .present-exit{display:inline-flex}
@media (max-width:560px){ h1{font-size:1.35rem} .sheet{padding:14px} .kpi .v{font-size:1.35rem} .hbar{grid-template-columns:minmax(0,1fr) auto} .hbar .track{grid-column:1/-1;grid-row:2} }
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .4s ease} }
</style>

<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">คณะวิศวกรรมศาสตร์ มหาวิทยาลัยเชียงใหม่ · งานนโยบายและแผน</div>
      <h1>บัญชีรายรับ–รายจ่ายจริงและเงินทุนสะสม</h1>

    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="เมนู">

    <button data-view="ratios">สัดส่วนการแบ่ง</button>
  </nav>
  <main id="main"></main>
</div>

function matchProgram(name){
  const a = S.settings.aliases?.[nz(name)];
  if (a && prog(a.prog)) return {prog:a.prog, dept:a.dept, match:'alias'};
  const level = detectLevel(name), type = detectType(name), c = core(name);
  let best = null;
  for (const p of catalog()) {
    if (p.generic || p.level !== level || p.type !== type) continue;
    const pc = core(p.name);
    if (pc === c) return {prog:p.id, dept:p.dept, match:'exact'};
    if (pc && c && (c.startsWith(pc) || pc.startsWith(c)) && (!best || pc.length > best.len)) best = {prog:p.id, dept:p.dept, match:'near', len:pc.length};

// PDF copy often splits Thai after a tone mark and swaps the mark with อ: "เครือ่ งกล" -> "เครื่องกล"
const fixThai = s => s.replace(/([\u0E48-\u0E4B])\s+(?=[\u0E01-\u0E2E])/g, '$1').replace(/\u0E37\u0E2D([\u0E48-\u0E4B])/g, '\u0E37$1\u0E2D');

  let section = '', pending = '';
  for (let raw of String(text).split(/\r?\n/)) {
    const t = thaiDigits(raw.replace(/ /g,' ')).replace(/\s+(?=[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E])/g, '').replace(/([\u0E01-\u0E4E])(?=[\d(])/g, '$1 ').trim();   // a mark never starts a word
    if (!t) continue;

    if (dt && thaiDateISO(dt) && !out.memoDate) out.memoDate = thaiDateISO(dt);
    if (no || (dt && thaiDateISO(dt))) continue;
    const tm = t.match(/ภาค(?:การศึกษา|เรียน)ที่\s*(\d)\s*\/\s*(25\d\d)/);
    if (tm) { out.sem = +tm[1]; out.ay = +tm[2]; out.termNote = t.slice(tm.index + tm[0].length).trim(); continue; }
    if (/ค่าธรรมเนียม/.test(t) && !/\d{3}/.test(t)) { out.title = t; continue; }

    if (/^\(.*\)$/.test(t)) continue;                                    // amount in words
    const m = t.match(/^(.*?[^\d\s,.\-(])\s+((?:-|\(?[\d,]+(?:\.\d+)?\)?)(?:\s+(?:-|\(?[\d,]+(?:\.\d+)?\)?))*)\s*(?:บาท)?$/);
    if (!m) {

      else if (/^(ป\.\s?(ตรี|โท|เอก)|ปริญญา|บัณฑิต|ระดับ)/.test(t) && !out.subtitle) out.subtitle = t;
      else if (/สาขา/.test(t) && !/รายการ|คณะวิศวกรรมศาสตร์|เอกสารแนบ/.test(t)) pending += (pending ? ' ' : '') + t;

    if (/^รวม/.test(nz(name))) { out.memoTotal = nums[nums.length-1]; const sp = splitRow(nums); if (sp) out.totalA = sp.A; continue; }
    if (/รายการ|นักศึกษา\s*รักษา/.test(name)) continue;
    if (nums.every(x => !x)) { section = name; continue; }               // a heading row such as "นักศึกษาต่างชาติ - -"
    if (ADJ_RE.test(name)) { out.lines.push(adjLine(name, nums[nums.length-1], section)); continue; }
    const L = {name, n:0, keep:0, A:0, B:0, L:0, T0:null, tot0:null, note:section, totalOnly:false};
    const cells = splitRow(nums);
    if (cells) Object.assign(L, cells);

      else out.unread.push(t);

}

const thaiDigits = s => String(s).replace(/[๐-๙]/g, c => '๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function thaiDateISO(m){
  let mi = TH_MONTHS.findIndex(x => nz(m[2]).startsWith(nz(x))); if (mi < 0) mi = TH_MON_ABBR.indexOf(m[2]); if (mi < 0) return '';

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

  if (!window.pdfjsWorker) await loadScript(PDFJS + 'pdf.worker.min.js');

  return window.pdfjsLib;

async function pdfToText(buf){

    const page = await doc.getPage(p), tc = await page.getTextContent(), vp = page.getViewport({scale:1});
    // place text as it appears on the page: landscape reports are often stored as rotated portrait pages
    const items = tc.items.filter(i => i.str).map(i => { const m = lib.Util.transform(vp.transform, i.transform);
      return {s:i.str, x:m[4], y:-m[5], w:i.width, h:Math.hypot(m[2], m[3]) || i.height || 10}; });
    items.sort((a,b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) { const r = rows.find(r => Math.abs(r.y - it.y) <= Math.max(2, Math.min(r.h, it.h) * .45)); if (r) r.items.push(it); else rows.push({y:it.y, h:it.h, items:[it]}); }
    rows.sort((a,b) => b.y - a.y);
    for (const r of rows) {                                   // rebuild each printed row; wide gaps become column breaks
      r.items.sort((a,b) => a.x - b.x); let s = '', end = null;
      for (const it of r.items) { if (end !== null) { const gap = it.x - end; s += gap > it.h * 1.2 ? '   ' : gap > it.h * .2 ? ' ' : ''; } s += it.s; end = it.x + it.w; }

      lines.push(fixPua(s).normalize('NFC').replace(/\u0E4D\u0E32/g, 'ำ').replace(/(?<=[\u0E01-\u0E4E])[A-Za-z\u00C0-\u017F](?=[\u0E01-\u0E4E])/g, '').trimEnd());
    }

  }

  const type = /Special/i.test(text) ? 'ภาคพิเศษ' : /Inter/i.test(text) ? 'นานาชาติ' : 'ภาคปกติ';

    subtitle:`${grad ? 'บัณฑิตศึกษา' : 'ป.ตรี'} ${type} (รายงานสำนักทะเบียน${reportDate ? ' ' + thaiDate(reportDate) : ''})`};

    if (!t) continue;
    const m = t.match(/^(.*?[^\d\s,.\-(])\s+((?:-|\(?[\d,]+(?:\.\d+)?\)?)(?:\s+(?:-|\(?[\d,]+(?:\.\d+)?\)?))*)\s*(?:บาท)?$/);
    if (/^(รายการ|คณะวิศวกรรมศาสตร์|ภาค(การศึกษา|เรียน)ที่|หน้า\s*\d|จำนวน|เงิน$|ทะเบียน|อื่น$)/.test(t) || /มหาวิทยาลัย.*คณะ/.test(t)) continue;   // headings repeated on later pages
    if (!m && /นักศึกษาต่างชาติ/.test(t) && t.length < 40) { section = 'นักศึกษาต่างชาติ'; continue; }
    if (!m) { if (/\d[\d,]{3,}/.test(t)) out.unread.push(t); else if (!/^\(/.test(t) && !/^[\d\s.,-]+$/.test(t)) pending += (pending ? ' ' : '') + t; continue; }
    const name = fixThai((pending ? pending + ' ' : '') + m[1].trim()); pending = '';
    const nums = m[2].split(/\s+/).map(x => x === '-' ? 0 : num(x));
    if (nums.every(x => !x)) { section = name; continue; }
    if (ADJ_RE.test(name)) { out.lines.push(adjLine(name, nums[0], section)); continue; }   // คณะฯ column (the first figure on the row)
    const f = facultyShare(nums);
    if (!f && !/^รวม/.test(nz(name))) out.unread.push(t);
    if (/^รวม/.test(nz(name))) { if (f) { out.memoTotal = f.fac; out.grossTotal = f.total; } continue; }
    out.lines.push({name, n:f?.pre[0] || 0, keep:f && f.pre.length > 1 ? f.pre[1] : 0, A:f ? f.fac : 0, B:0, L:0, T0:null, tot0:f ? f.fac : null,
      gross:nums[nums.length-1], note:section, totalOnly:false, grad:out.grad || isGradText(name), facUnsure:!f});
  }
  if (!out.subtitle) { const g = out.lines.filter(l => !l.adj).every(l => l.grad); out.subtitle = (g ? 'บัณฑิตศึกษา' : 'ป.ตรี') + (head.termNote ? ' ' + head.termNote : (g ? '' : ' ระบบเหมาจ่าย')); }
  return out.lines.length ? out : null;
}

// "บวก …" / "หัก …" rows adjust the faculty's money: they belong to ส่วนกลางคณะ only, with their sign
const ADJ_RE = /^(บวก|หัก)\s/;
const adjLine = (name, v, note) => { const a = /^หัก/.test(name) ? -Math.abs(v) : v;
  return {name, n:0, keep:0, A:a, B:0, L:0, T0:null, tot0:a, note, totalOnly:false, adj:true}; };

// one table row: [students] [kept-status] คณะฯ [ทุน 20%] รวม [ห้องสมุด] รวม — blank cells are often missing, '-' cells read as 0
const ROW_PATTERNS = [['A','B','T','L'], ['A','T','L'], ['A','B','T'], ['A','T']];
function splitRow(nums){
  const k = nums.length, tot = nums[k-1];
  if (!(tot > 0)) return null;
  for (const pat of ROW_PATTERNS) {
    if (k < pat.length + 1) continue;
    const v = {}; pat.forEach((key, i) => v[key] = nums[k - 1 - pat.length + i]);
    const B = v.B ?? 0, L = v.L ?? 0;
    if (Math.abs(v.A + B - v.T) < .6 && Math.abs(v.T + L - tot) < .6) {
      const pre = nums.slice(0, k - 1 - pat.length);
      return {n:pre[0] || 0, keep:pre.length >= 2 ? pre[1] : 0, A:v.A, B, L, T0:v.T, tot0:tot};
    }
  }
  return null;
}

/* ---------- memos written as running text (no allocation table) ---------- */
const UNIT_WORDS = [['ส่วนกลางคณะ','office'],['สำนักงานคณะ','office'],['Entaneer','mec'],['Academy','mec'],['วิชาพื้นฐาน','basic'],['(259)','basic'],
  ['ศูนย์การศึกษานานาชาติ','cmies'],['CMIES','cmies'],['พัฒนานักศึกษา','student'],['ห้องสมุดคณะ','lib']].concat(DEPT_KEYS.map(([w, d]) => [w, 'd:' + d]));
function unitsIn(text){                     // receiving units named in a piece of text, last mention last
  const t = nz(text), hits = [];
  UNIT_WORDS.forEach(([w, u]) => { const i = t.lastIndexOf(nz(w)); if (i >= 0) hits.push([i, u]); });
  return hits.sort((a,b) => a[0] - b[0]).map(h => h[1]);
}
const AMOUNT_RE = /(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*บาท/g;
function parseProse(text){
  const flat = thaiDigits(text).replace(/ /g,' ').replace(/[ \t]+/g,' ');
  const subject = ((flat.match(/เรื่อง\s+([^\n]+)/) || [])[1] || '').trim();
  const all = [...new Set(unitsIn(flat))], found = [];
  for (const m of flat.matchAll(AMOUNT_RE)) {
    const v = num(m[1]); if (v < 100) continue;
    const before = flat.slice(Math.max(0, m.index - 250), m.index), near = unitsIn(before);
    found.push({v, total:/(รวม|ทั้งสิ้น)[^\n\d]{0,25}$/.test(before), unit: near[near.length-1] || (all.length === 1 ? all[0] : '')});
  }
  const uniq = []; found.forEach(a => { if (!uniq.some(x => Math.abs(x.v - a.v) < .01)) uniq.push(a); });
  let total = uniq.find(a => a.total) || null;
  const rest = uniq.filter(a => a !== total);
  if (!total && rest.length > 2) { const big = rest.reduce((m, a) => a.v > m.v ? a : m), others = rest.filter(a => a !== big);
    if (Math.abs(others.reduce((s, a) => s + a.v, 0) - big.v) < .01) total = big; }
  const rows = uniq.filter(a => a !== total);
  return {subject, total: total?.v ?? null, rows: rows.length ? rows : (total ? [total] : []), amounts: uniq.map(a => a.v)};
}
const markAmounts = text => esc(thaiDigits(text)).replace(AMOUNT_RE, (m0, n) => num(n) >= 100 ? `<button class="amt" data-act="add-amt" data-v="${num(n)}" title="เพิ่มเป็นรายการ">${m0}</button>` : m0);

// ค่าธรรมเนียมการสอน listed by course: an engineering course pays its owning unit in full;
// a course of another faculty is what the faculty pays out, deducted from ส่วนกลางคณะ
const MONEY_RE = /\(?-?\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\)?/g;
function parseTeaching(text){
  const flat = thaiDigits(String(text)).replace(/\u00A0/g, ' ').replace(/[ \t]+(?=[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E])/g, '');   // a mark never starts a word
  if (!/สอน|กระบวนวิชา|scch/i.test(flat)) return null;
  const rows = []; let total = null;
  for (const raw of flat.split(/\r?\n/)) {
    const t = raw.replace(/\s+/g, ' ').trim(), m = t.match(COURSE_RE);
    if (!m) { if (/รวม/.test(t)) { const ns = [...t.matchAll(MONEY_RE)].map(x => x[0]).filter(x => /[,.]/.test(x)); if (ns.length) total = Math.abs(num(ns[ns.length - 1])); } continue; }
    const code = m[1], rest = t.slice(m.index + m[0].length), ns = [...rest.matchAll(MONEY_RE)].map(x => x[0]);
    const money = ns.filter(x => /[,.]/.test(x)), pick = money.length ? money[money.length - 1] : ns[ns.length - 1];
    const v = pick == null ? 0 : Math.abs(num(pick)); if (!v) continue;
    const title = COURSES[code] || rest.replace(MONEY_RE, '').replace(/\(?(คิดเหมาจ่าย|เหมาจ่าย)?\s*(คน|บาท|หน่วยกิต|ชั่วโมง)\)?/g, '').replace(/[():]+/g, ' ').replace(/\s+/g, ' ').trim(), unit = courseUnit(code);
    rows.push(unit ? {label:`ค่าสอน ${code} ${title}`.trim(), v, unit, course:code}
                   : {label:`จ่ายค่าสอนคณะอื่น ${code} ${title}`.trim(), v:-v, unit:'office', course:code, ext:true});
  }
  if (rows.length < 2) return null;
  const subject = ((flat.match(/เรื่อง\s+([^\n]+)/) || [])[1] || '').trim() || 'ค่าธรรมเนียมการสอน';
  // the document's total is unsigned: it is the net (a payment out reads as negative), or the sum of every row listed when money goes both ways
  const net = r2(rows.reduce((s, a) => s + a.v, 0)), gross = r2(rows.reduce((s, a) => s + Math.abs(a.v), 0));
  const memoTotal = total == null ? null : Math.abs(total - Math.abs(net)) < .01 ? Math.sign(net || 1) * total : Math.abs(total - gross) < .01 ? net : total;
  return {subject, total:memoTotal, rows, amounts:rows.map(a => a.v)};
}

/* ---------- allocation (pure) ---------- */
// one ratio per program: the sheet's year-2-onward row (กองคลัง memos do not split students by year)
function blended(l){ return l.rN.slice(); }
// the amount split is the row's last "รวม" column (คณะฯ + ทุน 20% + ห้องสมุด) for ป.ตรี, and the คณะฯ column for graduate rows
function allocLine(l){
  const r = blended(l), fac = r2((+l.A || 0) + (+l.B || 0) + (+l.L || 0)), o = {};
  BUCKETS.forEach((b,i) => o[b] = r2(fac * r[i]));
  const resid = r2(fac - BUCKETS.reduce((s,b) => s + o[b], 0));
  o.dept = r2(o.dept + resid);
  return {...o, lib:0, fac, r, resid};
}
function recordRows(rec){
  const rows = [], libUnit = S.settings.libUnit || 'lib';
  rec.lines.forEach((l, li) => {
    if (l.fixed) { const base = lineTotal(l);
      Object.entries(l.fixed).forEach(([u, v]) => { if (v) rows.push({unit:u, src:'fee', li, prog:l.name, type:l.type, level:l.level, amount:r2(v), base, n:+l.n||0}); }); return; }
    const a = allocLine(l);
    const pname = l.name;
    BUCKETS.forEach(b => { if (a[b]) rows.push({unit: b === 'dept' ? 'd:' + (l.dept || '?') : BUCKET_UNIT[b], src:'fee', li, prog:pname, type:l.type, level:l.level, amount:a[b], base:a.fac, n:+l.n||0}); });
    if (a.lib) rows.push({unit:libUnit, src:'lib', li, prog:pname, type:l.type, level:l.level, amount:a.lib, base:a.fac, n:+l.n||0});
  });
  (rec.others || []).forEach((o, oi) => { if (num(o.amount)) rows.push({unit:o.unit || 'office', src:'other', li:-1, prog:o.label || 'รายรับอื่น', type:'', amount:r2(num(o.amount)), base:0, n:0}); });
  return rows;
}
const lineTotal = l => l.fixed ? r2(Object.values(l.fixed).reduce((s,v) => s + (+v||0), 0)) : (+l.A||0) + (+l.B||0) + (+l.L||0);
const recordTotal = rec => r2(rec.lines.reduce((s,l) => s + lineTotal(l), 0) + (rec.others||[]).reduce((s,o) => s + num(o.amount), 0));
// in-year allocations between university units (ค่าสอนนอกคณะ, จัดสรรตามบันทึก): the memo's "รวม" covers every unit
// that shares the money, the faculty being one of them, so it is a reference figure, not a check
const sharedMemo = rec => rec.kind === 'prose' || rec.kind === 'teach' || +rec.sem === 0;
function recordCheck(rec){
  if (rec.memoTotal == null || rec.memoTotal === '') return {state:'none'};
  const d = r2(recordTotal(rec) - num(rec.memoTotal));
  if (Math.abs(d) < 0.01) return {state:'ok'};
  if (!sharedMemo(rec)) return {state:'diff', d};
  return Math.abs(Math.abs(recordTotal(rec)) - Math.abs(num(rec.memoTotal))) < 0.01 ? {state:'ok'} : {state:'ref', d};   // a payment out is listed unsigned
}

/* ---------- storage: artifact db when available, else this browser ---------- */
const Store = {
  async init(){
    if (window.claude && typeof window.claude.use === 'function') {
      try { const db = await window.claude.use('db'); if (db) { S.db = db; S.mode = 'cloud'; } } catch(e) {}
      try { S.downloads = await window.claude.use('downloads'); } catch(e) {}
    }
    if (S.mode === 'cloud') {
      S.db.collection('ledger').onSnapshot(snap => { S.records = snap.docs.map(d => ({...thaw(d.data()), id:d.id})); render(); },
        e => { toast('อ่านฐานข้อมูลไม่สำเร็จ (' + e.code + ')'); });
      S.db.collection('cash').onSnapshot(snap => { S.cash = snap.docs.map(d => ({...thaw(d.data()), id:d.id})); render(); },
        e => { toast('อ่านรายจ่ายไม่สำเร็จ (' + e.code + ')'); });
      S.db.doc('config/settings').onSnapshot(d => { if (d.exists) { S.settings = normSettings(d.data()); invalidate(); render(); } }, () => {});
    } else {
      S.mode = 'local';
      try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (j) { S.records = j.records || []; S.cash = j.cash || []; S.settings = normSettings(j.settings || {}); } } catch(e) {}
    }
    render();
  },
  persistLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({records:S.records, cash:S.cash, settings:S.settings})); } catch(e) { toast('เบราว์เซอร์ไม่ยอมให้บันทึก — โปรดสำรองไฟล์'); } },
  async saveRecord(rec){
    if (S.mode === 'cloud') { const {id, ...body} = rec; await S.db.collection('ledger').doc(id).set(body); }
    else { const i = S.records.findIndex(r => r.id === rec.id); if (i >= 0) S.records[i] = rec; else S.records.push(rec); this.persistLocal(); render(); }
  },
  async deleteRecord(id){
    if (S.mode === 'cloud') await S.db.collection('ledger').doc(id).delete();
    else { S.records = S.records.filter(r => r.id !== id); this.persistLocal(); render(); }
  },
  async saveCash(c){
    if (S.mode === 'cloud') { const {id, ...body} = c; await S.db.collection('cash').doc(id).set(body); }
    else { const i = S.cash.findIndex(x => x.id === c.id); if (i >= 0) S.cash[i] = c; else S.cash.push(c); this.persistLocal(); render(); }
  },
  async deleteCash(id){
    if (S.mode === 'cloud') await S.db.collection('cash').doc(id).delete();
    else { S.cash = S.cash.filter(x => x.id !== id); this.persistLocal(); render(); }
  },
  async saveSettings(){
    invalidate();
    if (S.mode === 'cloud') await S.db.doc('config/settings').set(JSON.parse(JSON.stringify(S.settings)));
    else { this.persistLocal(); }
    render();
  },
  async download(filename, data, type){
    if (S.downloads) { try { await S.downloads.save({filename, data: new Blob([data], {type})}); } catch(e) { if (e?.code !== 'cancelled') toast('ดาวน์โหลดไม่สำเร็จ'); } return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
};
// documents from the store arrive frozen (nested objects too); the page edits settings in place, so work on a copy
const thaw = o => JSON.parse(JSON.stringify(o ?? {}));
function normSettings(s){ return {aliases:{}, unitNames:{}, ratioEdits:{}, catalog:null, libUnit:'lib', openings:{}, coursePrefix:{}, ...thaw(s)}; }

/* ---------- charts ---------- */
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function barChart(data, {height=230} = {}){
  if (!data.length) return '';
  const big = Math.max(...data.map(d => d.value)) >= 1e6, div = big ? 1e6 : 1e3, unit = big ? 'ล้านบาท' : 'พันบาท';
  const W = 680, H = height, L = 52, R = 10, T = 22, B = 34;
  const max = niceMax(Math.max(...data.map(d => d.value)) / div) ;
  const pw = W - L - R, ph = H - T - B, step = pw / data.length, bw = Math.min(46, step * .56);
  const y = v => T + ph - (v / div) / max * ph;
  let g = '<g class="grid">';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = T + ph - ph * i / 4;
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${v.toLocaleString('th-TH',{maximumFractionDigits:2})}</text>`; }
  g += `</g><text x="${L-8}" y="${T-9}" text-anchor="end">${unit}</text>`;
  const labelAll = data.length <= 6;
  const bars = data.map((d,i) => {
    const cx = L + step * i + step / 2, x = cx - bw/2, yy = y(d.value), h = Math.max(0, T + ph - yy), rr = Math.min(4, h);
    const path = h > 0 ? `M${x},${T+ph} V${yy+rr} Q${x},${yy} ${x+rr},${yy} H${x+bw-rr} Q${x+bw},${yy} ${x+bw},${yy+rr} V${T+ph} Z` : '';
    const tip = esc(d.label + ' · ' + fmt(d.value) + ' บาท');
    return `<path class="bar${i === data.length-1 ? ' on' : ''}" d="${path}" data-tip="${tip}"><title>${tip}</title></path>
      <rect x="${cx-step/2}" y="${T}" width="${step}" height="${ph}" fill="transparent" data-tip="${tip}"/>
      ${(labelAll || i === data.length-1) && d.value ? `<text class="val" x="${cx}" y="${yy-6}" text-anchor="middle">${(d.value/div).toLocaleString('th-TH',{maximumFractionDigits:2})}</text>` : ''}
      <text x="${cx}" y="${H-12}" text-anchor="middle">${esc(d.label)}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟแท่งรายรับรายภาคการศึกษา">${g}${bars}<line class="base" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/></svg></div>`;
}
function hbars(items){
  const tot = items.reduce((s,d) => s + d.value, 0), max = Math.max(...items.map(d => d.value), 1);
  return `<div class="hbars">${items.map(d => `<div class="hbar" data-tip="${esc(d.label + ' · ' + fmt(d.value) + ' บาท')}">
    <div class="lab">${esc(d.label)}</div><div class="track"><div class="fill" style="width:${(d.value/max*100).toFixed(2)}%"></div></div>
    <div class="amt"><b>${fmtM(d.value)}</b> · ${tot ? pct(d.value/tot) : '–'}</div></div>`).join('')}</div>`;
}

function updateEntry(){
  const d = S.draft; if (!d) return;
  const tbody = document.querySelector('.grid-in tbody');
  let sn = 0, sk = 0, sA = 0, sB = 0, sL = 0;
  d.lines.forEach((l,i) => {
    const tr = document.querySelector(`tr[data-li="${i}"]`); if (!tr) return;
    const tot = lineTotal(l);
    sn += +l.n||0; sk += +l.keep||0; sA += +l.A||0; sB += +l.B||0; sL += +l.L||0;
    tr.querySelector('[data-out="tot"]').textContent = fmt(tot);
    const chips = [];
    if (l.fixed) chips.push(l.match === 'central' ? `<span class="chip good">${l.adj ? 'รายการบวก/หัก · ' : l.foreign ? 'นักศึกษาต่างชาติ · ' : ''}เข้าส่วนกลางคณะทั้งจำนวน</span>` : '<span class="chip info">นำเข้าจากไฟล์เดิม · ใช้ยอดแบ่งตามไฟล์</span>');
    else { const mc = MATCH_CHIP[l.match] || MATCH_CHIP.manual; chips.push(`<span class="chip ${mc[0]}">${mc[1]}</span>`); }
    if (!l.dept && !l.fixed) chips.push('<span class="chip bad">เลือกภาควิชา</span>');
    if (l.tot0 != null) chips.push(Math.abs(tot - l.tot0) < 0.6 ? '<span class="chip good">✓ ยอดแถวตรง</span>' : `<span class="chip bad">ยอดแถวตามบันทึก ${fmt(l.tot0)}</span>`);
    if (l.totalOnly && !(+l.A||+l.B)) chips.push('<span class="chip warn">เติมคณะฯ / ทุน / ห้องสมุด</span>');
    if (l.note) chips.push(`<span class="chip info">${esc(l.note)}</span>`);
    if (l.grad) chips.push(`<span class="chip info">บัณฑิต · ใช้ช่องคณะฯ${l.gross ? ' จากยอดรวม ' + fmt(l.gross) : ''}</span>`);
    const pr = prog(l.prog); if (pr && pr.net && +l.n) { const per = ((+l.A||0)+(+l.B||0)) / ((+l.n||0)); chips.push(`<span class="chip info">เข้าคณะเฉลี่ย ${fmt0(per)}/คน · ชีท ${fmt0(pr.net)}</span>`); }
    tr.querySelector('[data-out="chips"]').innerHTML = chips.join('');
  });
  const gt = $('#grid-total');
  if (gt) gt.innerHTML = `<td>รวม ${d.lines.length} หลักสูตร</td><td></td><td class="num">${fmt0(sn)}</td><td class="num">${fmt0(sk)}</td><td class="num">${fmt(sA)}</td><td class="num">${fmt(sB)}</td><td class="num">${fmt(sL)}</td><td class="num">${fmt(sA+sB+sL)}</td><td></td>`;
  const tot = recordTotal(d), c = recordCheck(d);
  const fyWarn = +d.ay > 2500 && +d.sem !== 0 && +d.fy !== +d.ay + 1 ? `<span class="chip warn">ปีการศึกษา ${d.ay} ควรลงปีงบประมาณ ${+d.ay + 1}</span>` : '';
  const ref = d.files?.length ? `แถว “รวม” ในไฟล์ ${esc(d.files.join(' + '))}` : 'ช่องยอดรวมตามไฟล์';
  $('#check').innerHTML = fyWarn + `<span>ยอดที่อ่านได้ <b class="num">${fmt(tot)}</b> บาท</span>` + (c.state === 'ok' ? `<span class="chip good">✓ ตรงกับ${ref}</span>`

/* ----- fund position: carried forward + actual income − actual expenses ----- */
let _agg = null;
const EMPTY_AGG = {inc:0, exp:0, memo:0, direct:0, draw:0, adj:0, tuition:0, oh:0, service:0, other:0};
const NON_EXP = ['inc','draw','adjust'];
const incCol = cat => { const t = nz(cat).toLowerCase(); return t.startsWith(nz('ค่าเทอม')) ? 'tuition' : /^oh|overhead/.test(t) ? 'oh' : /service|บริการวิชาการ/.test(t) ? 'service' : 'other'; };
function agg(){
  if (_agg) return _agg;
  const m = {};
  const add = (fy, u, k, v) => { ((m[fy] ||= {})[u] ||= {...EMPTY_AGG})[k] += v; };
  S.records.forEach(r => recordRows(r).forEach(x => { add(+r.fy, x.unit, 'inc', x.amount); add(+r.fy, x.unit, 'memo', x.amount); add(+r.fy, x.unit, r.kind === 'teach' ? 'other' : 'tuition', x.amount); }));
  S.cash.forEach(c => (c.rows || []).forEach(x => { if (!x.unit) return; const v = num(x.amount);
    // an old "adjust" row is income of its unit (money in the faculty account that no memo itemises)
    if (x.kind === 'inc' || x.kind === 'adjust') { add(+c.fy, x.unit, 'inc', v); add(+c.fy, x.unit, 'direct', v); add(+c.fy, x.unit, incCol(x.cat), v); }
    else if (x.kind === 'draw') add(+c.fy, x.unit, 'draw', v);
    else add(+c.fy, x.unit, 'exp', v); }));
  return _agg = m;
}
function fyOfAll(){
  const op = S.settings.openings || {};
  const s = new Set([...S.records.map(r => +r.fy), ...S.cash.map(c => +c.fy), ...Object.keys(op).filter(k => Object.keys(op[k] || {}).length).map(Number)]);
  return [...s].filter(Boolean).sort((a,b) => a - b);
}
function unitList(){ const s = new Set(allUnits()); Object.values(agg()).forEach(m => Object.keys(m).forEach(u => s.add(u))); return [...s]; }
function fundSeries(unit){
  let prev = null;
  return fyOfAll().map(fy => {
    const man = S.settings.openings?.[fy]?.[unit], a = agg()[fy]?.[unit] || EMPTY_AGG;
    const opening = man != null ? +man : (prev ?? 0);
    const row = {fy, opening:r2(opening), src: man != null ? 'manual' : prev != null ? 'carried' : 'none',
      inc:r2(a.inc), memo:r2(a.memo), direct:r2(a.direct), tuition:r2(a.tuition), oh:r2(a.oh), service:r2(a.service), other:r2(a.other), draw:r2(a.draw), adj:r2(a.adj), exp:r2(a.exp), net:r2(a.inc - a.exp)};
    row.close = r2(row.opening + row.net + row.adj); prev = row.close;
    return Object.assign(row, investOf(row));
  });
}
/* ----- investment capacity from savings -----
 * Approved savings use is spent through the year's budget, so what has been disbursed is already in รายจ่ายจริง and the
 * approval is never deducted again. Each year compares the approved amount with 40% of the savings held at its start,
 * and the next year may invest up to 40% of the savings carried forward. */
const INVEST_SHARE = 0.4;
const investOf = row => ({cap:r2(INVEST_SHARE * Math.max(0, row.close)), limit:r2(INVEST_SHARE * Math.max(0, row.opening))});
// approved savings use against the ceiling of 40% of the savings held at the start of the year
function limitBar(used, base, big){
  const lim = INVEST_SHARE * Math.max(0, base), over = used > lim + .005, share = base > 0 ? used / base : (used ? 1 : 0);
  const tip = base > 0 ? `อนุมัติใช้ ${fmt(used)} บาท = ${pct(share)} ของเงินสะสมต้นปี · เพดาน 40% = ${fmt(lim)} บาท` : `ไม่มีเงินสะสมต้นปี · อนุมัติใช้ ${fmt(used)} บาท`;
  return `<div class="lbar${big ? ' big' : ''}" role="img" aria-label="${esc(tip)}" title="${esc(tip)}"><span class="fill${over ? ' over' : ''}" style="width:${(Math.min(share, 1) * 100).toFixed(1)}%"></span><span class="cap"></span></div>`;
}
const limitCell = s => s.draw ? `<div class="lcell">${limitBar(s.draw, s.opening)}<span class="sub">${s.opening > 0 ? pct(s.draw / s.opening) : 'ไม่มีเงินสะสมต้นปี'}</span></div>` : '<span class="sub">–</span>';
function investBlock(o, who){
  const lim = o.limit, over = o.draw > lim + .005, share = o.opening > 0 ? o.draw / o.opening : null;
  return `<div class="invest">
    <div class="inv-h"><h3>อำนาจการลงทุนจากเงินสะสม${who ? ' · ' + esc(who) : ''} <span class="sub">(ไม่เกินร้อยละ 40)</span></h3><span class="chip ${over ? 'bad' : 'good'}">${over ? `▲ เกินเพดาน ${fmt(o.draw - lim)} บาท` : `✓ อยู่ในเพดาน · ต่ำกว่า ${fmtM(lim - o.draw)}`}</span></div>
    <div class="inv-k">ปีงบประมาณ ${o.fy} อนุมัติใช้เงินสะสม <b class="num">${fmt(o.draw)}</b> บาท${share != null ? ` = <b>${pct(share)}</b> ของเงินสะสมต้นปี` : ''}</div>
    ${limitBar(o.draw, o.opening, true)}
    <div class="inv-scale"><span>0</span><span class="mark">เพดาน 40% = ${fmt(lim)}</span><span>เงินสะสมต้นปี ${fmtM(o.opening)}</span></div>
    <div class="inv-next"><span class="k">ลงทุนได้ปีงบประมาณ ${o.fy + 1} ไม่เกิน</span><b class="num">${fmtM(o.cap)}</b><span class="s">= 40% ของทุนสะสมยกไป ${fmtM(o.close)}</span></div>
  </div>`;
}
function facultySeries(){
  const all = unitList().map(fundSeries);

const fmtS = x => (x >= 0 ? '+' : '−') + fmt(Math.abs(x));

function netChart(data){
  if (!data.length) return '';
  const W = 680, H = 220, L = 56, R = 10, T = 22, B = 34, vals = data.map(d => d.value);
  const big = Math.max(...vals.map(Math.abs)) >= 1e6, div = big ? 1e6 : 1e3, unit = big ? 'ล้านบาท' : 'พันบาท';
  let hi = Math.max(0, ...vals) / div, lo = Math.min(0, ...vals) / div;
  const span = (hi - lo) || 1, p10 = Math.pow(10, Math.floor(Math.log10(span / 4))), stp = [1,2,2.5,5,10].map(m => m * p10).find(v => v >= span / 4);
  hi = Math.ceil(hi / stp) * stp; lo = Math.floor(lo / stp) * stp; if (hi === lo) hi = lo + stp;
  const nT = Math.round((hi - lo) / stp);
  const ph = H - T - B, pw = W - L - R, y = v => T + (hi - v / div) / (hi - lo) * ph, y0 = y(0);
  const step = pw / data.length, bw = Math.min(46, step * .56);
  let g = '<g class="grid">';
  for (let i = 0; i <= nT; i++) { const v = lo + stp * i, yy = y(v * div);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${v.toLocaleString('th-TH',{maximumFractionDigits:2})}</text>`; }
  g += `</g><text x="${L-8}" y="${T-9}" text-anchor="end">${unit}</text>`;
  const bars = data.map((d, i) => {
    const cx = L + step * i + step / 2, x = cx - bw / 2, yy = y(d.value), h = Math.abs(yy - y0), rr = Math.min(4, h), pos = d.value >= 0;
    const path = !h ? '' : pos ? `M${x},${y0} V${yy+rr} Q${x},${yy} ${x+rr},${yy} H${x+bw-rr} Q${x+bw},${yy} ${x+bw},${yy+rr} V${y0} Z`
                               : `M${x},${y0} V${yy-rr} Q${x},${yy} ${x+rr},${yy} H${x+bw-rr} Q${x+bw},${yy} ${x+bw},${yy-rr} V${y0} Z`;
    const tip = esc(d.label + ' · สุทธิ ' + fmtS(d.value) + ' บาท');
    return `<path class="bar ${pos ? 'pos' : 'neg'}" d="${path}" data-tip="${tip}"><title>${tip}</title></path>
      <rect x="${cx-step/2}" y="${T}" width="${step}" height="${ph}" fill="transparent" data-tip="${tip}"/>
      <text class="val" x="${cx}" y="${pos ? yy - 6 : yy + 14}" text-anchor="middle">${(d.value >= 0 ? '+' : '−') + (Math.abs(d.value) / div).toLocaleString('th-TH',{maximumFractionDigits:2})}</text>
      <text x="${cx}" y="${H-12}" text-anchor="middle">${esc(d.label)}</text>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟผลสุทธิรายปีงบประมาณ">${g}${bars}<line class="base" x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}"/></svg></div>`;
}

function incomeTable(rows){

function newCash(){ const fy = S.records.length ? Math.max(...S.records.map(r => +r.fy)) : currentFY();
  return {id:null, fy, period:'ทั้งปีงบประมาณ', title:'สรุปรายจ่ายจริง', ref:'', date:'', docTotal:'', rows:[]}; }
function matchUnit(s){
  const raw = String(s || '').trim(), t = nz(raw).toLowerCase(), r = raw.toLowerCase();
  const has = re => re.test(t) || re.test(r);   // nz() drops tone marks, so Thai keywords are matched on the raw text too
  if (!t) return '';
  const cm = raw.match(/^(\d{6})(?!\d)/); if (cm) return courseUnit(cm[1]) || 'office';
  const byCode = allUnits().find(u => u.replace('d:','').toLowerCase() === t || u.toLowerCase() === t);
  if (byCode) return byCode;
  const byName = allUnits().find(u => nz(unitName(u)).toLowerCase() === t);
  if (byName) return byName;
  if (has(/สำนักงาน|ส่วนกลาง|^faculty$/)) return 'office';
  if (has(/พื้นฐาน|259/)) return 'basic';
  if (has(/entaneer|academy/)) return 'mec';
  if (has(/^sd$|ด้านพัฒนา/)) return 'student';
  if (t === 'mnp') return 'd:MN';
  if (has(/ห้องสมุด/)) return 'lib';
  if (has(/cmies|นานาชาติ/)) return 'cmies';
  if (has(/^mec/)) return 'mec';
  if (has(/ทุน|นักศึกษา/)) return 'student';
  const d = detectDept(raw); return d ? 'd:' + d : '';
}
function parseCash(text){
  const rows = [];
  for (const line of String(text).split(/\r?\n/)) {
    const t = line.replace(/ /g,' ').trim(); if (!t) continue;
    let cells = (t.includes('\t') ? t.split('\t') : t.split(/\s{2,}/)).map(c => c.trim()).filter(Boolean);
    if (cells.length === 1) { const m = t.match(/^(.*?)\s+(-?[\d,]+(?:\.\d+)?)$/); if (!m) continue; cells = [m[1], m[2]]; }
    let ai = -1; cells.forEach((c, i) => { if (/^-?[\d,]+(\.\d+)?$/.test(c.replace(/บาท$/,'').trim())) ai = i; });
    if (ai < 1 || /^รวม/.test(nz(cells[0]))) continue;
    const cat = cells.slice(1, ai).join(' ');
    rows.push({unit:matchUnit(cells[0]), unitRaw:cells[0], kind: /^รายรับ/.test(nz(cat)) ? 'inc' : /^เงินสะสม|^นำเงินสะสม/.test(nz(cat)) ? 'draw' : 'exp', cat: cat.replace(/^รายรับ\s*[-–:]?\s*/,''), amount:num(cells[ai]), note:cells.slice(ai+1).join(' ')});
  }
  return rows;
}

.netline{font-size:.95rem}.chip{display:inline-block;font-size:.75rem;border-radius:999px;padding:1px 9px}.chip.good{background:var(--good-bg);color:var(--good)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.pos{color:var(--good)}.neg{color:var(--bad)}.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th{text-align:left;color:var(--soft);font-size:.76rem;background:var(--panel);padding:7px 9px;border-bottom:1px solid var(--line)}
td{padding:6px 9px;border-bottom:1px solid var(--hair)}th.num,td.num{text-align:right;white-space:nowrap}tr.total td{font-weight:600;background:var(--panel)}.report td:first-child{min-width:12em}
.chart svg{width:100%;height:auto}.chart .grid line{stroke:var(--hair)}.chart .base{stroke:var(--soft)}.chart text{fill:var(--soft);font-family:var(--f-num);font-size:11px}.chart text.val{fill:var(--ink);font-weight:600}.chart .bar{fill:var(--bar)}.chart .bar.pos{fill:var(--good)}.chart .bar.neg{fill:var(--bad)}
.note{background:var(--panel);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--soft)}.foot{margin-top:18px;color:var(--muted);font-size:.78rem}
@media (max-width:640px){.stmt{grid-template-columns:1fr 1fr}}
@media print{body{padding:0}.tbox{overflow:visible}@page{size:A4;margin:14mm}}
.invest{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}.inv-row{display:flex;flex-direction:column;gap:6px}.inv-k{font-size:.92rem}
.inv-scale{position:relative;display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);min-height:1.2em}.inv-scale .mark{position:absolute;left:40%;transform:translateX(-50%);white-space:nowrap;color:var(--ink);font-weight:600}
.lbar{position:relative;height:8px;min-width:90px;background:var(--hair);border-radius:4px;margin:4px 0}.lbar.big{height:16px;border-radius:6px}.lbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:inherit}.lbar .fill.over{background:var(--bad)}.lbar .cap{position:absolute;left:40%;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}`;

  'อนุมัติใช้เงินสะสม','ใช้ไป (% ของเงินสะสมต้นปี · เพดาน 40)','เพดาน 40% ของเงินสะสมต้นปี','ลงทุนได้ปีถัดไป (40% ของทุนสะสมยกไป)'];
const fundRow = (label, s) => [label, s.opening, s.tuition, s.oh, s.service, s.other, s.inc, s.exp, s.net, s.close,
  s.draw || 0, s.opening > 0 ? r2(s.draw / s.opening * 100) : '', s.limit, s.cap];
function sheetOf(X, title, note, head, rows, widths){
  const ws = X.utils.aoa_to_sheet([[title], [note], [], head, ...rows]);
  const range = X.utils.decode_range(ws['!ref']);
  for (let R = 4; R <= range.e.r; R++) for (let C = 0; C <= range.e.c; C++) { const c = ws[X.utils.encode_cell({r:R, c:C})]; if (c && c.t === 'n' && !(C === 0 && head[0] === 'ปีงบประมาณ')) c.z = '#,##0.00;[Red]-#,##0.00'; }
  ws['!cols'] = (widths || head.map((h, i) => i ? 16 : 34)).map(w => ({wch:w}));
  ws['!merges'] = [{s:{r:0, c:0}, e:{r:0, c:Math.max(3, head.length - 1)}}, {s:{r:1, c:0}, e:{r:1, c:Math.max(3, head.length - 1)}}];
  return ws;
}
const sheetName = t => t.replace(/[\\/?*\[\]:]/g, ' ').slice(0, 31);

}
async function unitXlsx(unit){

  X.utils.book_append_sheet(wb, sheetOf(X, `ฐานะเงินทุนสะสม ${name}`, 'ทุนสะสมยกไป = ยกยอดมา + รายรับจริง − รายจ่ายจริง · ' + xlStamp() + ' · ไฟล์นี้มีเฉพาะข้อมูลของหน่วยงานนี้',
    FUND_HEAD, series.map(s => fundRow(s.fy, s))), 'เงินทุนสะสม');
  [...series].reverse().forEach(({fy}) => {
    const inc = S.records.filter(r => +r.fy === fy).sort((a, b) => termKey(a) - termKey(b)).flatMap(r => recordRows(r).filter(x => x.unit === unit).map(x =>
      [r.sem == 0 ? 'ระหว่างปี ' + r.ay : termLabel(r.ay, r.sem), x.prog || '', TYPE_LABEL[x.type] || x.type || '', [r.memoNo, r.memoDate ? thaiDate(r.memoDate) : ''].filter(Boolean).join(' · ') || r.title || '', x.base || '', x.amount]));
    const cash = S.cash.filter(c => +c.fy === fy).flatMap(c => (c.rows || []).filter(x => x.unit === unit && num(x.amount)).map(x => ({...x, batch:c})));
    cash.filter(x => x.kind === 'inc' || x.kind === 'adjust').forEach(x => inc.push(['ทั้งปี', x.cat || 'รายรับอื่น', '', x.note || x.batch.title || '', '', num(x.amount)]));
    if (inc.length) { inc.push(['รวมรายรับ', '', '', '', '', r2(inc.reduce((t, x) => t + x[5], 0))]);
      X.utils.book_append_sheet(wb, sheetOf(X, `รายรับจริง ${name} ปีงบประมาณ ${fy}`, 'ค่าธรรมเนียมแบ่งตามสัดส่วนในชีท “ค่าเทอมและสัดส่วน” · ฐานที่แบ่ง = ยอดของหลักสูตรก่อนแบ่ง',
        ['ภาคการศึกษา','หลักสูตร / รายการ','ประเภท','ที่มา (บันทึกกองคลัง)','ฐานที่แบ่ง','ได้รับ'], inc, [16, 46, 12, 34, 16, 16]), sheetName('รายรับ ' + fy)); }
    const cats = {}; cash.filter(x => !NON_EXP.includes(x.kind)).forEach(x => { const k = x.cat || 'ไม่ระบุหมวด'; cats[k] = r2((cats[k] || 0) + num(x.amount)); });
    const exp = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v]);
    if (exp.length) { exp.push(['รวมรายจ่าย', r2(exp.reduce((t, x) => t + x[1], 0))]);
      X.utils.book_append_sheet(wb, sheetOf(X, `รายจ่ายจริง ${name} ปีงบประมาณ ${fy}`, xlStamp(), ['หมวดรายจ่าย','จำนวนเงิน'], exp, [34, 18]), sheetName('รายจ่าย ' + fy)); }
  });
  return {name:`รายรับรายจ่าย-${unit.replace('d:','')}.xlsx`, data:X.write(wb, {bookType:'xlsx', type:'array'})};
}

function perHead(id){

  if (!ls.length) return '';
  const k = Math.max(...ls.map(l => l.k)), cur = ls.filter(l => l.k === k), n = cur.reduce((s, l) => s + +l.n, 0), a = cur.reduce((s, l) => s + +l.A, 0);
  return ` · ตามบันทึก ${cur[0].t} ≈ ${fmt0(a / n)}/คน (${n} คน)`;
}

        ${Object.keys(S.settings.aliases||{}).length ? `<div class="tbox"><table><tbody>${Object.entries(S.settings.aliases).map(([k,a]) => `<tr><td>${esc(a.label || k)}</td><td>${esc(prog(a.prog)?.name || a.prog)} · ${esc(a.dept)}</td><td><button class="x" data-act="del-alias" data-k="${esc(k)}" aria-label="ลบ">×</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="sub">ระบบจำการจับคู่ชื่อหลักสูตรในบันทึกกองคลังกับหลักสูตรในชีทเมื่อบันทึกลงบัญชี</p>'}
      </div></div>
    ${coursePrefixTable()}
  </section>`;
}

/* ---------- excel import (SheetJS loaded on demand) ---------- */
function loadXLSX(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); }); }
function catalogFromRows(rows){
  const map = new Map();
  for (let i = 2; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const name = String(r[5] ?? '').replace(/\s+/g,' ').trim(); if (!name || name === '0') continue;
    let typ = String(r[4] ?? '').trim(); typ = typ ? typ[0].toUpperCase() + typ.slice(1).toLowerCase() : '';
    const key = [r[2], r[3], typ, name].join('|');
    if (!map.has(key)) map.set(key, {dept:r[2], level:r[3], type:typ, name, years:{}});
    const ys = +r[7] || 0, rat = [12,13,14,15,16].map(j => Math.round((+r[j] || 0) * 1e4) / 1e4);
    (map.get(key).years[ys] ||= {rat, net:+r[11] || 0});
  }
  return [...map.values()].map(p => { const y1 = p.years[1], ks = Object.keys(p.years).filter(k => k !== '1'), yN = p.years[2] || (ks.length ? p.years[ks[0]] : y1);
    // เข้าคณะ per head: the current rate (year 1); the lower rate of students coded before 67 (ป.ตรี) or for ใช้บริการ (บัณฑิต, year 99)
    const plan = (y1 || yN).net, after = Math.min(...Object.values(p.years).map(y => y.net));
    return [p.dept, p.level, p.type, p.name, (y1 || yN).rat, (yN || y1).rat, plan, after !== plan ? after : 0]; });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-view],[data-act]'); if (!t) return;
  if (t.dataset.view) { S.view = t.dataset.view; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act, d = S.draft;
  if (a === 'go-entry') { S.view = 'entry'; render(); }
  else if (a === 'present-on') { document.body.classList.add('present'); }
  else if (a === 'present-off') { document.body.classList.remove('present'); }
  else if (a === 'draft-new') { S.draft = newDraft(); S.pasteText = ''; render(); }
  else if (a === 'parse') {
    S.pasteText = $('#paste').value;
    const p = parseMemo(S.pasteText);
    if (!p.lines.length) { toast('ไม่พบแถวตัวเลขในข้อความที่วาง'); return; }
    if (p.ay) { d.ay = p.ay; d.sem = p.sem; d.fy = defaultFY(p.ay); }
    mergeParsed(d, p);
    toast(`อ่านตารางแล้ว · ${d.lines.length} หลักสูตร`); render();
  }
  else if (a === 'q-open') {
    const i = S.queue.findIndex(q => q.qid === t.dataset.q); if (i < 0) return;
    if (S.draft && !S.draft.id && (S.draft.lines.length || S.draft.others.length)) S.queue.push({...S.draft, qid:S.draft.qid || uid()});
    S.draft = S.queue.splice(i, 1)[0]; S.draft.reviewed = true; render(); document.querySelector('.grid-in')?.scrollIntoView({block:'start'});
  }
  else if (a === 'cover-del') { S.covers = S.covers.filter(c => c.cid !== t.dataset.c); render(); }
  else if (a === 'q-del') { S.queue = S.queue.filter(q => q.qid !== t.dataset.q); render(); }
  else if (a === 'q-save' || a === 'q-save-ready') {
    const todo = a === 'q-save' ? S.queue.filter(q => q.qid === t.dataset.q && draftReady(q)) : S.queue.filter(draftReady);
    if (!todo.length) return;
    t.disabled = true; let ok = 0;
    for (const q of todo) { try { await saveDraft(q); S.queue = S.queue.filter(x => x !== q); ok++; } catch(err) { toast('บันทึกไม่สำเร็จ: ' + (err?.message || err?.code || 'ลองอีกครั้ง')); break; } }
    try { await Store.saveSettings(); } catch(e) {}
    toast(`บันทึกลงบัญชีแล้ว ${ok} ชุด`); render();
  }
  else if (a === 'add-line') { d.lines.push(lineFromParsed({name:'', n:0, keep:0, A:0, B:0, L:0, T0:null, tot0:null})); render(); }
  else if (a === 'del-line') { d.lines.splice(+t.dataset.li, 1); render(); }
  else if (a === 'add-other') { d.others.push({label:d.kind === 'prose' ? d.title : d.kind === 'teach' ? 'ค่าสอน ' : '', amount:'', unit:''}); render(); }
  else if (a === 'add-amt') { d.others.push({label:d.title || 'รายรับตามบันทึก', amount:+t.dataset.v, unit:unitsIn(d.sourceText || '').pop() || ''}); render(); toast('เพิ่มรายการ ' + fmt(+t.dataset.v) + ' บาท'); }
  else if (a === 'del-other') { d.others.splice(+t.dataset.oi, 1); render(); }
  else if (a === 'save') {
    t.disabled = true;
    try { await saveDraft(d); await Store.saveSettings();
      toast('บันทึกลงบัญชีแล้ว'); S.draft = null; S.pasteText = ''; if (!S.queue.length) S.view = 'records'; render();
    } catch(err) { t.disabled = false; toast(err?.message || 'บันทึกไม่สำเร็จ ลองอีกครั้ง'); }
  }
  else if (a === 'edit') { const r = S.records.find(x => x.id === t.dataset.id); if (r) { S.draft = JSON.parse(JSON.stringify(r)); S.draft.others ||= []; S.view = 'entry'; render(); } }
  else if (a === 'del') {
    const id = t.dataset.id;
    if (S.confirmDel === id) { S.confirmDel = null; try { await Store.deleteRecord(id); toast('ลบแล้ว'); } catch(err) { toast('ลบไม่สำเร็จ'); } render(); }
    else { S.confirmDel = id; render(); setTimeout(() => { if (S.confirmDel === id) { S.confirmDel = null; render(); } }, 4000); }
  }
  else if (a === 'cash-new') { S.cashDraft = newCash(); S.cashPaste = ''; render(); }
  else if (a === 'cash-parse') {
    S.cashPaste = $('#cash-paste').value; const rows = parseCash(S.cashPaste);
    if (!rows.length) { toast('ไม่พบแถวที่มีจำนวนเงิน'); return; }
    S.cashDraft.rows.push(...rows); toast(`อ่านได้ ${rows.length} รายการ`); render();
  }
  else if (a === 'cash-add') { S.cashDraft.rows.push({unit:'', kind:'exp', cat:'', amount:'', note:''}); render(); }
  else if (a === 'cash-del-row') { S.cashDraft.rows.splice(+t.dataset.ci, 1); render(); }
  else if (a === 'cash-save') {
    const c = S.cashDraft;
    if (!(+c.fy > 2500)) { toast('ระบุปีงบประมาณ (พ.ศ.)'); return; }
    if (c.rows.some(x => !x.unit)) { toast('ยังมีแถวที่ไม่ได้เลือกหน่วยงาน'); return; }
    const rec = {id:c.id || 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6), fy:+c.fy, period:c.period || '', title:c.title || '', ref:c.ref || '', date:c.date || '',
      docTotal: c.docTotal === '' || c.docTotal == null ? null : num(c.docTotal), rows:c.rows.map(x => ({unit:x.unit, kind:NON_EXP.includes(x.kind) ? x.kind : 'exp', cat:x.cat || '', amount:r2(num(x.amount)), note:x.note || ''})),
      createdAt:c.createdAt || new Date().toISOString(), updatedAt:new Date().toISOString()};
    t.disabled = true;
    try { await Store.saveCash(rec); toast('บันทึกรายการแล้ว'); S.cashDraft = null; S.cashPaste = ''; render(); }
    catch(err) { t.disabled = false; toast('บันทึกไม่สำเร็จ: ' + (err?.message || err?.code || 'ลองอีกครั้ง')); }
  }
  else if (a === 'cash-edit') { const b = S.cash.find(x => x.id === t.dataset.id); if (b) { S.cashDraft = JSON.parse(JSON.stringify({...b, docTotal: b.docTotal ?? ''})); render(); window.scrollTo(0,0); } }
  else if (a === 'cash-del') {
    const id = t.dataset.id;
    if (S.confirmDel === id) { S.confirmDel = null; try { await Store.deleteCash(id); toast('ลบแล้ว'); } catch(err) { toast('ลบไม่สำเร็จ'); } render(); }
    else { S.confirmDel = id; render(); setTimeout(() => { if (S.confirmDel === id) { S.confirmDel = null; render(); } }, 4000); }
  }
  else if (a === 'toggle-open') { S.editOpen = !S.editOpen; render(); }
  else if (a === 'xlsx-faculty') { try { const x = await facultyXlsx(); await Store.download(x.name, x.data, XLSX_TYPE); } catch(e) { toast('สร้างไฟล์ Excel ไม่สำเร็จ'); } }
  else if (a === 'xlsx-unit') { try { const x = await unitXlsx(S.unit); await Store.download(x.name, x.data, XLSX_TYPE); } catch(e) { toast('สร้างไฟล์ Excel ไม่สำเร็จ'); } }
  else if (a === 'xlsx-all-units') { try { for (const u of unitList().filter(unitHas)) { const x = await unitXlsx(u); await Store.download(x.name, x.data, XLSX_TYPE); } } catch(e) { toast('สร้างไฟล์ Excel ไม่สำเร็จ'); } }
  else if (a === 'export-unit') { const x = exportDoc(S.unit); if (x.has) await Store.download(x.name, x.html, 'text/html'); }
  else if (a === 'export-all-units') { for (const u of unitList()) { const x = exportDoc(u); if (x.has) await Store.download(x.name, x.html, 'text/html'); } }
  else if (a === 'export-csv') {
    const head = ['ปีงบประมาณ','ภาคการศึกษา/งวด','เลขที่อ้างอิง','ลงวันที่','หน่วยงาน','รับ/จ่าย','ประเภท/หมวด','หลักสูตร/รายการ','จำนวนเงิน'];
    const SRC = {fee:'ค่าธรรมเนียมการศึกษา', lib:'ค่าบำรุงห้องสมุด', other:'รายรับอื่นในบันทึก'};
    const lines = S.records.flatMap(r => recordRows(r).map(x => [r.fy, termLabel(r.ay,r.sem), r.memoNo||'', r.memoDate||'', unitName(x.unit), 'รับ', SRC[x.src], x.prog, x.amount.toFixed(2)]))
      .concat(S.cash.flatMap(c => (c.rows||[]).map(x => [c.fy, c.period||'', c.ref||'', c.date||'', unitName(x.unit), x.kind === 'inc' || x.kind === 'adjust' ? 'รับ' : x.kind === 'draw' ? 'นำเงินสะสมมาใช้' : x.kind === 'adjust' ? 'ปรับปรุงยอดเงินสะสม' : 'จ่าย', x.cat||'', x.note || c.title || '', (x.kind === 'exp' || !x.kind ? -num(x.amount) : num(x.amount)).toFixed(2)])));
    const csv = '﻿' + [head, ...lines].map(row => row.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v).join(',')).join('\n');
    await Store.download('บัญชีแบ่งรายรับ-แยกหน่วยงาน.csv', csv, 'text/csv');
  }
  else if (a === 'backup') { await Store.download('สำรองบัญชีแบ่งรายรับ-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify({version:2, records:S.records, cash:S.cash, settings:S.settings}, null, 1), 'application/json'); }
  else if (a === 'reset-ratios') { S.settings.ratioEdits = {}; await Store.saveSettings(); toast('คืนค่าสัดส่วนตามชีทแล้ว'); }
  else if (a === 'add-cpfx') { const k = document.getElementById('cpfx-new').value.trim(), u = document.getElementById('cpfx-unit').value;
    if (!/^\d{3}$/.test(k)) { toast('ใส่เลข 3 หลักแรกของรหัสวิชา'); return; }
    (S.settings.coursePrefix ||= {})[k] = u; await Store.saveSettings(); render(); toast(`วิชา ${k}xxx → ${unitName(u)}`); }
  else if (a === 'del-cpfx') { delete (S.settings.coursePrefix || {})[t.dataset.k]; await Store.saveSettings(); render(); }
  else if (a === 'del-alias') { delete S.settings.aliases[t.dataset.k]; await Store.saveSettings(); }
});

document.addEventListener('input', e => {
  const t = e.target, d = S.draft;
  if (t.dataset.d && d) { d[t.dataset.d] = t.dataset.d === 'memoTotal' ? (t.value.trim() === '' ? '' : num(t.value)) : t.value;
    if ((t.dataset.d === 'ay' || t.dataset.d === 'sem') && +d.ay > 2500) { d.fy = defaultFY(+d.ay, +d.sem); const f = $('#d-fy'); if (f) f.value = d.fy; }
    updateEntry(); return; }
  const tr = t.closest('tr[data-li]');
  if (tr && t.dataset.f && d) { const l = d.lines[+tr.dataset.li];
    if (t.dataset.f === 'name') l.name = t.value;
    else if (t.tagName === 'INPUT') l[t.dataset.f] = num(t.value);
    updateEntry(); return; }
  if (t.dataset.c && S.cashDraft) { S.cashDraft[t.dataset.c] = t.dataset.c === 'docTotal' ? (t.value.trim() === '' ? '' : num(t.value)) : t.value; updateCash(); return; }
  const ctr = t.closest('tr[data-ci]');
  if (ctr && t.dataset.cf && S.cashDraft && t.tagName === 'INPUT') { const r = S.cashDraft.rows[+ctr.dataset.ci]; r[t.dataset.cf] = t.dataset.cf === 'amount' ? num(t.value) : t.value; updateCash(); return; }
  const otr = t.closest('tr[data-oi]');
  if (otr && t.dataset.o && d && t.tagName === 'INPUT') { const o = d.others[+otr.dataset.oi]; o[t.dataset.o] = t.value;
    const cm = d.kind === 'teach' && t.dataset.o === 'label' && t.value.match(COURSE_RE);
    if (cm && cm[1] !== o.course) { o.course = cm[1]; o.unit = courseUnit(cm[1]) || 'office'; const sel = otr.querySelector('[data-o="unit"]'); if (sel) sel.value = o.unit;
      const v = Math.abs(num(o.amount)); if (v) { o.amount = courseUnit(cm[1]) ? v : -v; const ai = otr.querySelector('[data-o="amount"]'); if (ai) ai.value = fmt(o.amount); } }
    updateEntry(); }
});
document.addEventListener('change', async e => {
  const t = e.target, d = S.draft;
  if (t.dataset.d === 'sem' && d) { d.sem = +t.value; if (+d.ay > 2500) d.fy = defaultFY(+d.ay, d.sem); render(); return; }
  const tr = t.closest('tr[data-li]');
  if (tr && d && t.tagName === 'SELECT') { const l = d.lines[+tr.dataset.li];
    if (t.dataset.f === 'prog') setProg(l, t.value); else if (t.dataset.f === 'dept') { l.dept = t.value; if (l.match !== 'exact') l.match = 'manual'; }
    render(); return; }
  const ctr = t.closest('tr[data-ci]');
  if (ctr && S.cashDraft && t.tagName === 'SELECT') { const r = S.cashDraft.rows[+ctr.dataset.ci]; r[t.dataset.cf] = t.value; render(); return; }
  const otr = t.closest('tr[data-oi]');
  if (otr && d && t.dataset.o === 'unit') { d.others[+otr.dataset.oi].unit = t.value; updateEntry(); return; }
  if (t.dataset.bind === 'fy') { S.fy = t.value; render(); }
  else if (t.dataset.bind === 'unit') { S.unit = t.value; render(); }
  else if (t.dataset.bind === 'unitFy') { S.unitFy = +t.value; render(); }
  else if (t.dataset.bind === 'fundFy') { S.fundFy = +t.value; render(); }
  else if (t.dataset.open) { const fy = t.dataset.fy, op = S.settings.openings ||= {}; op[fy] ||= {};
    if (t.value.trim() === '') delete op[fy][t.dataset.open]; else op[fy][t.dataset.open] = num(t.value);
    if (!Object.keys(op[fy]).length) delete op[fy];
    await Store.saveSettings(); }
  else if (t.dataset.cpfx) { const k = t.dataset.cpfx; if (COURSE_PREFIX[k]?.[0] === t.value) delete (S.settings.coursePrefix || {})[k]; else (S.settings.coursePrefix ||= {})[k] = t.value; await Store.saveSettings(); }
  else if (t.dataset.bind === 'libUnit') { S.settings.libUnit = t.value; await Store.saveSettings(); }
  else if (t.dataset.uname) { const v = t.value.trim(); if (v) S.settings.unitNames[t.dataset.uname] = v; else delete S.settings.unitNames[t.dataset.uname]; await Store.saveSettings(); }
  else if (t.dataset.rid) {
    const p = prog(t.dataset.rid); if (!p) return;
    const e1 = {y1:[...p.y1], yN:[...p.yN]}, v = num(t.value) / 100, i = +t.dataset.i;
    if (t.dataset.w === 'both') { e1.y1[i] = v; e1.yN[i] = v; } else e1[t.dataset.w][i] = v;
    S.settings.ratioEdits[p.id] = e1; await Store.saveSettings();
  }
  else if (t.id === 'cash-img' && t.files.length) { const fs = [...t.files]; t.value = ''; cashImages(fs); }
  else if (t.id === 'memo-files' && t.files.length) { const fs = [...t.files]; t.value = ''; importFiles(fs); }
  else if (t.id === 'restore' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); if (!Array.isArray(j.records)) throw 0;
      for (const r of j.records) await Store.saveRecord(r);
      for (const c of (j.cash || [])) await Store.saveCash(c);
      if (j.settings) { S.settings = normSettings({...S.settings, ...j.settings}); await Store.saveSettings(); }
      toast(`นำเข้า ${j.records.length} บันทึกข้อความ และ ${(j.cash||[]).length} ชุดรายจ่ายแล้ว`); } catch(err) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของบัญชีนี้'); }
    t.value = '';
  }
  else if (t.id === 'xlsx-in' && t.files[0]) {
    toast('กำลังอ่านไฟล์ Excel…');
    try { const X = await loadXLSX(); const wb = X.read(await t.files[0].arrayBuffer(), {type:'array'});
      const ws = wb.Sheets['ค่าเทอมและสัดส่วน']; if (!ws) { toast('ไม่พบชีท “ค่าเทอมและสัดส่วน” ในไฟล์นี้'); return; }
      const programs = catalogFromRows(X.utils.sheet_to_json(ws, {header:1, raw:true}));
      if (!programs.length) { toast('ชีทไม่มีข้อมูลหลักสูตร'); return; }
      S.settings.catalog = {programs, source:t.files[0].name, at:new Date().toISOString()}; S.settings.ratioEdits = {};
      await Store.saveSettings(); toast(`นำเข้าสัดส่วน ${programs.length} หลักสูตรแล้ว`);
    } catch(err) { toast('อ่านไฟล์ไม่สำเร็จ'); }
    t.value = '';
  }
});

/* drag-and-drop of กองคลัง files onto the entry page */
// a screenshot in the table's layout becomes rows: unit, category, amount (rows ไม่รู้จัก stay for the viewer to pick)
async function cashImages(files){
  S.cashReading = true; render(); let n = 0;
  for (const f of files) {
    try { const text = await imageToText(f), rows = parseCash(text);
      S.cashPaste = ((S.cashPaste || '').trim() + '\n' + text).trim(); S.cashDraft.rows.push(...rows); n += rows.length; }
    catch(e) { toast(e.message); }
  }
  S.cashReading = false; render(); if (n) toast(`อ่านจากรูปได้ ${n} รายการ · ตรวจหน่วยงานและจำนวนเงินกับรูปก่อนบันทึก`);
}
// Ctrl+V of a screenshot: memo pages go to the import queue, expense pages to the expense rows
document.addEventListener('paste', e => {
  const fs = [...(e.clipboardData?.files || [])].filter(isImage); if (!fs.length || !['entry','cash'].includes(S.view)) return;
  e.preventDefault();
  const named = fs.map((f, i) => new File([f], `ภาพที่วาง ${new Date().toLocaleTimeString('th-TH')}${fs.length > 1 ? ' (' + (i + 1) + ')' : ''}.png`, {type:f.type || 'image/png'}));
  if (S.view === 'entry') importFiles(named); else cashImages(named);
});
document.addEventListener('dragover', e => { const z = e.target.closest?.('#drop'); if (!z) return; e.preventDefault(); z.classList.add('over'); });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#drop'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('#drop'); if (!z) return; e.preventDefault(); z.classList.remove('over'); importFiles(e.dataTransfer.files); });

/* tooltip */
const tip = $('#tip');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el) { tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { if (!tip.hidden) { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px'; } });

render();
Store.init();
